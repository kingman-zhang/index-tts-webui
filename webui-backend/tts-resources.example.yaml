# TTS 段级资源池 —— 一个账号 / 一台服务器 = 一条资源，`provider` 决定它是什么。
#
# 用法：cp tts-resources.example.yaml data/config/tts-resources.yaml
#      然后在 backend 的 .env 里写 TTS_RESOURCES_FILE=data/config/tts-resources.yaml
#
# 为什么是 YAML 而不是 JSON：**能写注释**。想先停用某台服务器、要用了再放开，
# 把那一整条每行前面加 `#` 即可，不用删掉再凭记忆写回来（2026-10-08 由 JSON 切换）。
#
# ⚠️ 凭据只填**环境变量名**，密钥的值写在 backend 的 .env 里 —— 别把密钥写进本文件。
# ⚠️ 文件扩展名必须是 .yaml / .yml（一个叫 .json 的文件里写着注释，两边工具都不认）。
# ⚠️ 别用 Tab 缩进，YAML 只允许空格。

- id: gpu-a
  provider: local
  base_url: http://127.0.0.1:8000
- id: gpu-b
  provider: local
  base_url: http://127.0.0.1:8001
- id: art
  provider: art
  api_key_env: AUTODL_API_TOKEN
- id: ai302
  provider: 302ai
  api_key_env: INDEXTTS302_API_KEY
  max_concurrency: 3
- id: siliconflow
  provider: siliconflow
  api_key_env: SILICONFLOW_API_KEY
