# podcast-webui 生产部署（docker compose）
# 用法：
#   首次:  cp webui-backend/.env.example webui-backend/.env && 填 Key
#          docker compose up -d --build
#   升级:  git pull && docker compose up -d --build   （数据全在挂载卷，重建不丢）
#   日志:  docker compose logs -f backend
# 对外端口通过 .env 的 PODCAST_WEB_PORT 调整（默认 8088）；
# backend 仅在 compose 内网可达，不对外暴露。
services:
  backend:
    build: ./webui-backend
    image: podcast-backend:latest
    container_name: podcast-backend
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      # 显式环境变量优先于挂载的旧 backend .env；仍允许部署环境自定义或设 0 关闭。
      # ⚠️ 这两个必须在这里显式透传：挂载进容器的旧 .env 里的 MEMBER_REG_BONUS=100
      # 会顶掉代码新默认值 500（2026-10-05 调值时的真实教训）。
      MEMBER_REG_BONUS: "${MEMBER_REG_BONUS:-500}"
      MEMBER_CHECKIN_BONUS: "${MEMBER_CHECKIN_BONUS:-20}"
    volumes:
      # 数据卷：项目存档/会员/队列状态/breezeblue 音色库（165MB）全在这里
      - ./webui-backend/data:/app/data
      - ./webui-backend/logs:/app/logs
      # .env 挂载而非烘焙进镜像；改配置后 docker compose restart backend 生效
      - ./webui-backend/.env:/app/.env:ro
      # 可选非敏感资源 YAML 放在 data/config/，已由上面的数据卷挂载。
      # backend .env 设置 TTS_RESOURCES_FILE=/app/data/config/tts-resources.yaml
      # （2026-10-08 由 .json 切 YAML：能写注释，停用一台整条 # 掉即可；旧文件 mv 改名就用）
      # 多账号密钥仍只写 backend .env；不要写入配置、镜像或 compose environment。
    expose:
      - "3001"
    healthcheck:
      # 探 /api/health（后端自身存活）：/api/tts/health 是代理本地 tts-server
      # 的探针，云端引擎部署（服务器无 GPU TTS）恒 503，不能用作容器探活
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/api/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

  web:
    build: ./webui-frontend
    image: podcast-web:latest
    container_name: podcast-web
    restart: unless-stopped
    ports:
      - "${PODCAST_WEB_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: software_app-net