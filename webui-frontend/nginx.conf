# podcast-webui 前端 nginx 配置
# 后端服务名 backend 由 docker-compose 网络解析（compose 内网，不对外暴露）
server {
    listen 80;
    server_name _;

    # 音色上传（wav 参考音频可达数十 MB）与音色库音频回源
    client_max_body_size 200m;

    root /usr/share/nginx/html;
    index index.html;

    # API 反代到后端容器（前端 BASE="/api"，后端路由全部以 /api 开头，原样透传）
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务：批量提交、音频下载不超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ─── 落地页（`/`）────────────────────────────────────────────────────
    # 优先返回构建期预渲染的 landing.html（由 scripts/prerender.mjs 生成）：
    # 它是一份完整静态文档（head + 正文 + FAQ/SoftwareApplication 结构化数据），
    # 不执行 JS 的爬虫也能读到全文 —— 这是本页能被搜到的地基。
    #
    # 第二个参数是回落：产物缺失时内部跳回 index.html，React 会渲染同一个落地页组件，
    # 所以这条规则在「产物在」和「产物不在」两种情况下都不会 404。
    # ⚠️ exact match（`=`）优先于下面的 `location /`，不必依赖书写顺序。
    location = / {
        try_files /landing.html /index.html;
    }

    # 同一份内容不该有两个可被收录的 URL
    location = /landing.html {
        return 301 /;
    }

    # vite 产物带内容哈希，长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退（/dubbing、/account 等直接刷新不 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    # ⚠️ 必须显式声明。gzip_proxied 默认是 off ⇒ **请求头带 `Via` 时不压缩**，
    # 而本站在 Caddy 之后（Caddy 转发时会加上请求 `Via`）⇒ 缺这一行等于全站 gzip 失效。
    # 实测证据：绕开 Caddy 直连 nginx 得到 `Content-Encoding: gzip`；经 Caddy 则没有；
    # 容器内手动加 `--header='Via: 1.1 Caddy'` 精确复现"不压缩"。
    gzip_proxied any;
    # 让 CDN/中间缓存按 Accept-Encoding 区分副本 —— 否则可能把 gzip 版发给不支持的客户端。
    gzip_vary on;
}
